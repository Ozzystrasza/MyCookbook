<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f5d3a" />
    <title>Gerenciar · My Cookbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="auth-gate"></div>
    <header class="site-header" data-site-header></header>
    <main class="page">
      <section class="panel">
        <h1>Gerenciar catálogos</h1>
        <p class="hint">Categorias, medidas e ingredientes reutilizáveis com fotos.</p>
        <p class="status" data-status hidden></p>

        <div class="tabs" data-tabs>
          <button type="button" class="btn btn--ghost is-active" data-tab="categories">Categorias</button>
          <button type="button" class="btn btn--ghost" data-tab="measures">Medidas</button>
          <button type="button" class="btn btn--ghost" data-tab="ingredients">Ingredientes</button>
        </div>

        <div data-panel-categories>
          <div class="actions actions--sticky">
            <button type="button" class="icon-btn icon-btn--primary" data-open-add="categories" aria-label="Adicionar categoria" title="Adicionar categoria"></button>
          </div>
          <div class="catalog-add" data-add-panel="categories" hidden>
            <form id="category-form" class="stack">
              <label class="field">
                <span>Nome</span>
                <input id="category-name" required placeholder="Sobremesas" />
              </label>
              <div class="catalog-add__actions">
                <button type="submit" class="icon-btn icon-btn--primary" aria-label="Confirmar" title="Confirmar"></button>
                <button type="button" class="icon-btn" data-cancel-add="categories" aria-label="Cancelar" title="Cancelar"></button>
              </div>
            </form>
          </div>
          <div class="catalog-grid" data-category-list></div>
        </div>

        <div data-panel-measures hidden>
          <div class="actions actions--sticky">
            <button type="button" class="icon-btn icon-btn--primary" data-open-add="measures" aria-label="Adicionar medida" title="Adicionar medida"></button>
          </div>
          <div class="catalog-add" data-add-panel="measures" hidden>
            <form id="measure-form" class="stack">
              <div class="row row--2">
                <label class="field">
                  <span>Nome</span>
                  <input id="measure-name" required placeholder="colher de sopa" />
                </label>
                <label class="field">
                  <span>Abreviação</span>
                  <input id="measure-abbrev" placeholder="c.s." />
                </label>
              </div>
              <div class="catalog-add__actions">
                <button type="submit" class="icon-btn icon-btn--primary" aria-label="Confirmar" title="Confirmar"></button>
                <button type="button" class="icon-btn" data-cancel-add="measures" aria-label="Cancelar" title="Cancelar"></button>
              </div>
            </form>
          </div>
          <div class="catalog-grid" data-measure-list></div>
        </div>

        <div data-panel-ingredients hidden>
          <div class="actions actions--sticky">
            <button type="button" class="icon-btn icon-btn--primary" data-open-add="ingredients" aria-label="Adicionar ingrediente" title="Adicionar ingrediente"></button>
          </div>
          <div class="catalog-add" data-add-panel="ingredients" hidden>
            <form id="ingredient-form" class="stack">
              <label class="field">
                <span>Nome</span>
                <input id="ingredient-name" required placeholder="Farinha de trigo" />
              </label>
              <div class="field">
                <span>Foto</span>
                <div data-ingredient-image></div>
              </div>
              <div class="catalog-add__actions">
                <button type="submit" class="icon-btn icon-btn--primary" aria-label="Confirmar" title="Confirmar"></button>
                <button type="button" class="icon-btn" data-cancel-add="ingredients" aria-label="Cancelar" title="Cancelar"></button>
              </div>
            </form>
          </div>
          <div class="catalog-grid" data-ingredient-list></div>
        </div>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/github.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shopping.js"></script>
    <script src="js/manage.js"></script>
  </body>
</html>
