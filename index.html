<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f5d3a" />
    <title>My Cookbook</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="auth-gate"></div>
    <header class="site-header" data-site-header></header>
    <main class="page page--book">
      <div class="book" data-book>
        <div class="book__chrome" data-book-chrome>
          <div class="book__modes" data-book-modes>
            <button
              type="button"
              class="book__mode-btn"
              data-view="book"
              aria-pressed="true"
              title="Vista de livro"
              aria-label="Vista de livro"
            >
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5V5.5zm16 0V21.5A2.5 2.5 0 0 1 17.5 19H13V3h4.5A2.5 2.5 0 0 1 20 5.5z"
                />
              </svg>
            </button>
            <button
              type="button"
              class="book__mode-btn"
              data-view="list"
              aria-pressed="false"
              title="Vista de lista"
              aria-label="Vista de lista"
            >
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"
                />
              </svg>
            </button>
          </div>
          <div class="book__reading-bar" data-reading-bar hidden>
            <button type="button" class="icon-btn" data-back aria-label="Voltar">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path
                  d="M12.5 4.5L7 10l5.5 5.5"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="book__reading-actions">
              <button
                type="button"
                class="icon-btn"
                data-add-to-cart
                hidden
                title="Adicionar à lista de compras"
                aria-label="Adicionar à lista de compras"
              >
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path
                    d="M3.5 4.5h1.2l1.1 8.2a1.5 1.5 0 0 0 1.5 1.3h6.9a1.5 1.5 0 0 0 1.5-1.2l1.1-5.3H6.2"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <circle cx="8.2" cy="16.2" r="1.1" fill="currentColor" />
                  <circle cx="14" cy="16.2" r="1.1" fill="currentColor" />
                  <path d="M14.5 3.5v4M12.5 5.5h4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
                </svg>
              </button>
              <a class="icon-btn" data-edit hidden title="Editar receita" aria-label="Editar receita">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path
                    d="M12.1 4.4l3.5 3.5M4 16l.9-3.4L13.2 4.3a1.5 1.5 0 0 1 2.1 0l.4.4a1.5 1.5 0 0 1 0 2.1L7.4 15.1 4 16z"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </a>
            </div>
          </div>
          <label class="book__search" data-book-search>
            <span class="visually-hidden">Buscar receitas</span>
            <input
              type="search"
              data-recipe-search
              placeholder="Buscar receitas"
              autocomplete="off"
            />
          </label>
          <div class="book__actions" data-book-actions>
            <button
              type="button"
              class="book__mode-btn"
              data-favorites
              aria-pressed="false"
              title="Mostrar favoritos"
              aria-label="Mostrar favoritos"
            >
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                />
              </svg>
            </button>
            <button
              type="button"
              class="book__mode-btn"
              data-filter-toggle
              aria-pressed="false"
              aria-expanded="false"
              aria-controls="book-filter-panel"
              title="Filtrar receitas"
              aria-label="Filtrar receitas"
            >
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M3 5h18v2.17L14 14.17V19l-4 2v-6.83L3 7.17V5z"
                />
              </svg>
            </button>
            <div
              id="book-filter-panel"
              class="book-filter"
              data-filter-panel
              hidden
              role="dialog"
              aria-label="Filtrar por categoria"
            >
              <p class="book-filter__title">Categorias</p>
              <div class="book-filter__list" data-filter-list></div>
              <div class="book-filter__actions">
                <button type="button" class="btn btn--ghost btn--small" data-filter-reset>
                  Limpar filtros
                </button>
                <button type="button" class="btn btn--primary btn--small" data-filter-apply>
                  Aplicar
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="book__stage">
          <button type="button" class="icon-btn book__nav book__nav--prev" data-prev aria-label="Páginas anteriores" hidden>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path
                d="M12.5 4.5L7 10l5.5 5.5"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <div class="book__spread" data-spread>
            <article class="book__page book__page--left" data-page="left"></article>
            <div class="book__spine" aria-hidden="true"></div>
            <article class="book__page book__page--right" data-page="right"></article>
          </div>
          <button type="button" class="icon-btn book__nav book__nav--next" data-next aria-label="Próximas páginas" hidden>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path
                d="M7.5 4.5L13 10l-5.5 5.5"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/github.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shopping.js"></script>
    <script src="js/book.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
