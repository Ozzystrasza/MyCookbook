<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f5d3a" />
    <title>My Cookbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italianno&family=Marck+Script&family=Playwrite+HU:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="auth-gate"></div>
    <header class="site-header" data-site-header></header>
    <main class="page page--book">
      <div class="book" data-book>
        <div class="book__chrome" data-book-chrome>
          <div class="book__modes" data-book-modes>
            <button
              type="button"
              class="book__mode-btn"
              data-view="book"
              aria-pressed="true"
              title="Vista de livro"
              aria-label="Vista de livro"
            >
              <svg width="22" height="22" viewBox="0 -960 960 960" aria-hidden="true">
                <path fill="currentColor" d="M260-320q47 0 91.5 10.5T440-278v-394q-41-24-87-36t-93-12q-36 0-71.5 7T120-692v396q35-12 69.5-18t70.5-6Zm260 42q44-21 88.5-31.5T700-320q36 0 70.5 6t69.5 18v-396q-33-14-68.5-21t-71.5-7q-47 0-93 12t-87 36v394Zm-40 118q-48-38-104-59t-116-21q-42 0-82.5 11T100-198q-21 11-40.5-1T40-234v-482q0-11 5.5-21T62-752q46-24 96-36t102-12q58 0 113.5 15T480-740q51-30 106.5-45T700-800q52 0 102 12t96 36q11 5 16.5 15t5.5 21v482q0 23-19.5 35t-40.5 1q-37-20-77.5-31T700-240q-60 0-116 21t-104 59ZM280-494Z"/>
              </svg>
            </button>
            <button
              type="button"
              class="book__mode-btn"
              data-view="list"
              aria-pressed="false"
              title="Vista de lista"
              aria-label="Vista de lista"
            >
              <svg width="22" height="22" viewBox="0 -960 960 960" aria-hidden="true">
                <path fill="currentColor" d="M360-200v-80h480v80H360Zm0-240v-80h480v80H360Zm0-240v-80h480v80H360ZM200-160q-33 0-56.5-23.5T120-240q0-33 23.5-56.5T200-320q33 0 56.5 23.5T280-240q0 33-23.5 56.5T200-160Zm0-240q-33 0-56.5-23.5T120-480q0-33 23.5-56.5T200-560q33 0 56.5 23.5T280-480q0 33-23.5 56.5T200-400Zm0-240q-33 0-56.5-23.5T120-720q0-33 23.5-56.5T200-800q33 0 56.5 23.5T280-720q0 33-23.5 56.5T200-640Z"/>
              </svg>
            </button>
          </div>
          <div class="book__reading-bar" data-reading-bar hidden>
            <button type="button" class="icon-btn" data-back aria-label="Voltar">
              <svg width="20" height="20" viewBox="0 -960 960 960" aria-hidden="true">
                <path fill="currentColor" d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"/>
              </svg>
            </button>
            <div class="book__reading-actions">
              <button
                type="button"
                class="icon-btn"
                data-add-to-cart
                hidden
                title="Adicionar à lista de compras"
                aria-label="Adicionar à lista de compras"
              >
                <svg width="20" height="20" viewBox="0 -960 960 960" aria-hidden="true">
                  <path fill="currentColor" d="M440-600v-120H320v-80h120v-120h80v120h120v80H520v120h-80ZM280-80q-33 0-56.5-23.5T200-160q0-33 23.5-56.5T280-240q33 0 56.5 23.5T360-160q0 33-23.5 56.5T280-80Zm400 0q-33 0-56.5-23.5T600-160q0-33 23.5-56.5T680-240q33 0 56.5 23.5T760-160q0 33-23.5 56.5T680-80ZM40-800v-80h131l170 360h280l156-280h91L692-482q-11 20-29.5 31T622-440H324l-44 80h480v80H280q-45 0-68.5-39t-1.5-79l54-98-144-304H40Z"/>
                </svg>
              </button>
              <a class="icon-btn" data-edit hidden title="Editar receita" aria-label="Editar receita">
                <svg width="20" height="20" viewBox="0 -960 960 960" aria-hidden="true">
                  <path fill="currentColor" d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/>
                </svg>
              </a>
            </div>
          </div>
          <div class="book__shopping-bar" data-shopping-bar hidden>
            <button type="button" class="icon-btn" data-shopping-back aria-label="Voltar">
              <svg width="20" height="20" viewBox="0 -960 960 960" aria-hidden="true">
                <path fill="currentColor" d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"/>
              </svg>
            </button>
            <div class="book__shopping-actions">
              <button type="button" class="icon-btn" data-shopping-add title="Adicionar" aria-label="Adicionar ingrediente">
                <svg width="20" height="20" viewBox="0 -960 960 960" aria-hidden="true">
                  <path fill="currentColor" d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/>
                </svg>
              </button>
              <button type="button" class="icon-btn" data-shopping-clear title="Limpar lista" aria-label="Limpar lista">
                <svg width="20" height="20" viewBox="0 -960 960 960" aria-hidden="true">
                  <path fill="currentColor" d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="book__shopping-bar" data-edit-bar hidden>
            <button type="button" class="icon-btn" data-edit-back aria-label="Voltar">
              <svg width="20" height="20" viewBox="0 -960 960 960" aria-hidden="true">
                <path fill="currentColor" d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"/>
              </svg>
            </button>
          </div>
          <div class="book__shopping-bar" data-manage-bar hidden>
            <button type="button" class="icon-btn" data-manage-back aria-label="Voltar">
              <svg width="20" height="20" viewBox="0 -960 960 960" aria-hidden="true">
                <path fill="currentColor" d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"/>
              </svg>
            </button>
          </div>
          <label class="book__search" data-book-search>
            <span class="visually-hidden">Buscar receitas</span>
            <input
              type="search"
              data-recipe-search
              placeholder="Buscar receitas"
              autocomplete="off"
            />
          </label>
          <div class="book__actions" data-book-actions>
            <button
              type="button"
              class="book__mode-btn"
              data-favorites
              aria-pressed="false"
              title="Mostrar favoritos"
              aria-label="Mostrar favoritos"
            >
              <svg width="22" height="22" viewBox="0 -960 960 960" aria-hidden="true">
                <path fill="currentColor" d="m480-120-58-52q-101-91-167-157T150-447.5Q111-500 95.5-544T80-634q0-94 63-157t157-63q52 0 99 22t81 62q34-40 81-62t99-22q94 0 157 63t63 157q0 46-15.5 90T810-447.5Q771-395 705-329T538-172l-58 52Zm0-108q96-86 158-147.5t98-107q36-45.5 50-81t14-70.5q0-60-40-100t-100-40q-47 0-87 26.5T518-680h-76q-15-41-55-67.5T300-774q-60 0-100 40t-40 100q0 35 14 70.5t50 81q36 45.5 98 107T480-228Zm0-273Z"/>
              </svg>
            </button>
            <button
              type="button"
              class="book__mode-btn"
              data-filter-toggle
              aria-pressed="false"
              aria-expanded="false"
              aria-controls="book-filter-panel"
              title="Filtrar receitas"
              aria-label="Filtrar receitas"
            >
              <svg width="22" height="22" viewBox="0 -960 960 960" aria-hidden="true">
                <path fill="currentColor" d="M440-160q-17 0-28.5-11.5T400-200v-240L168-736q-15-20-4.5-42t36.5-22h560q26 0 36.5 22t-4.5 42L560-440v240q0 17-11.5 28.5T520-160h-80Zm40-308 198-252H282l198 252Zm0 0Z"/>
              </svg>
            </button>
            <div
              id="book-filter-panel"
              class="book-filter"
              data-filter-panel
              hidden
              role="dialog"
              aria-label="Filtrar por categoria"
            >
              <p class="book-filter__title">Categorias</p>
              <div class="book-filter__list" data-filter-list></div>
              <div class="book-filter__actions">
                <button type="button" class="icon-btn" data-filter-reset aria-label="Limpar filtros" title="Limpar filtros"></button>
                <button type="button" class="icon-btn icon-btn--primary" data-filter-apply aria-label="Aplicar" title="Aplicar"></button>
              </div>
            </div>
          </div>
        </div>

        <div class="book__stage">
          <button type="button" class="icon-btn book__nav book__nav--prev" data-prev aria-label="Páginas anteriores" hidden>
            <svg width="20" height="20" viewBox="0 -960 960 960" aria-hidden="true">
              <path fill="currentColor" d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"/>
            </svg>
          </button>
          <div class="book__flip-slot" data-flip-slot hidden>
            <div class="book__flip" data-flip-root></div>
            <div class="book__flip-spine" aria-hidden="true"></div>
          </div>
          <div class="book__spread" data-spread>
            <article class="book__page book__page--left" data-page="left"></article>
            <div class="book__spine" aria-hidden="true"></div>
            <article class="book__page book__page--right" data-page="right"></article>
          </div>
          <button type="button" class="icon-btn book__nav book__nav--next" data-next aria-label="Próximas páginas" hidden>
            <svg width="20" height="20" viewBox="0 -960 960 960" aria-hidden="true">
              <path fill="currentColor" d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z"/>
            </svg>
          </button>
        </div>
      </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/github.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shopping.js"></script>
    <script src="vendor/page-flip.browser.js"></script>
    <script src="js/book.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
