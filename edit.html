<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f5d3a" />
    <title>Editar receita · My Cookbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="auth-gate"></div>
    <header class="site-header" data-site-header></header>
    <main class="page">
      <section class="panel">
        <h1 id="page-title">Nova receita</h1>
        <p class="hint">Salva direto no seu repositório público do GitHub. Visitantes não veem esta página sem o seu token.</p>
        <p class="status" data-status hidden></p>
        <form id="recipe-form" class="stack">
          <div class="row row--2">
            <label class="field">
              <span>Título</span>
              <input id="title" name="title" required />
            </label>
            <div class="field">
              <span>Categoria</span>
              <div class="catalog-picker">
                <input type="hidden" id="categoryId" name="categoryId" value="" />
                <button type="button" class="ingredient-picker__trigger" data-category-trigger data-picker-trigger aria-haspopup="dialog">
                  <span class="ingredient-picker__value is-placeholder">Selecione…</span>
                  <svg class="ingredient-picker__chevron" width="16" height="16" viewBox="0 -960 960 960" aria-hidden="true"><path fill="currentColor" d="M480-344 240-584l56-56 184 184 184-184 56 56-240 240Z"/></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="field">
            <span>Imagem da receita</span>
            <div data-recipe-image></div>
          </div>

          <div class="toolbar toolbar--compact">
            <h2 class="toolbar__label">Grupos</h2>
            <button type="button" class="icon-btn" data-add-group aria-label="Adicionar grupo" title="Adicionar grupo">
              <svg width="20" height="20" viewBox="0 -960 960 960" aria-hidden="true">
                <path fill="currentColor" d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/>
              </svg>
            </button>
          </div>
          <div class="stack" data-groups-editor></div>

          <div class="actions actions--sticky">
            <button type="submit" class="btn btn--primary">Salvar receita</button>
            <button type="button" class="btn btn--danger" data-delete hidden>Excluir receita</button>
            <a class="btn btn--ghost" href="index.html?home=1">Cancelar</a>
          </div>
        </form>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/github.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shopping.js"></script>
    <script src="js/edit-recipe.js"></script>
  </body>
</html>
