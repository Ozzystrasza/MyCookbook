<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f5d3a" />
    <title>Editar receita · My Cookbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italianno&family=Marck+Script&family=Playwrite+HU:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="auth-gate"></div>
    <header class="site-header" data-site-header></header>
    <main class="page">
      <section class="panel">
        <h1 id="page-title">Nova receita</h1>
        <p class="status" data-status hidden></p>
        <form id="recipe-form" class="stack">
          <div class="row row--2">
            <label class="field">
              <span>Título</span>
              <input id="title" name="title" required />
            </label>
            <div class="field">
              <div class="toolbar toolbar--compact category-tags__header">
                <span class="toolbar__label">Categorias</span>
                <button type="button" class="icon-btn" data-category-trigger aria-haspopup="dialog" aria-label="Adicionar categoria" title="Adicionar categoria">
                  <svg width="20" height="20" viewBox="0 -960 960 960" aria-hidden="true">
                    <path fill="currentColor" d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/>
                  </svg>
                </button>
              </div>
              <div class="category-tags" data-category-tags>
                <div class="category-tags__list" data-category-chips></div>
              </div>
            </div>
          </div>
          <div class="field">
            <span>Imagem da receita</span>
            <div data-recipe-image></div>
          </div>

          <div class="toolbar toolbar--compact">
            <h2 class="toolbar__label">Grupos</h2>
            <button type="button" class="icon-btn" data-add-group aria-label="Adicionar grupo" title="Adicionar grupo">
              <svg width="20" height="20" viewBox="0 -960 960 960" aria-hidden="true">
                <path fill="currentColor" d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/>
              </svg>
            </button>
          </div>
          <div class="stack" data-groups-editor></div>
        </form>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/github.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shopping.js"></script>
    <script src="js/edit-recipe.js"></script>
  </body>
</html>
