<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Closed cookbook">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3f2e"/>
      <stop offset="55%" stop-color="#1f3f28"/>
      <stop offset="100%" stop-color="#16261a"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d6b48"/>
      <stop offset="100%" stop-color="#2f5d3a"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3320"/>
      <stop offset="45%" stop-color="#244a2e"/>
      <stop offset="100%" stop-color="#1f3f28"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ebe3d2"/>
      <stop offset="100%" stop-color="#f7f1e4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- soft table glow -->
  <ellipse cx="400" cy="410" rx="260" ry="36" fill="#0d1610" opacity="0.45"/>

  <!-- book body -->
  <g transform="translate(170 95)">
    <!-- pages edge -->
    <path d="M420 28h34c8 0 14 6 14 14v292c0 8-6 14-14 14h-34V28z" fill="url(#pages)"/>
    <path d="M424 48h22M424 68h22M424 88h22M424 108h22M424 128h22M424 148h22M424 168h22M424 188h22M424 208h22M424 228h22M424 248h22M424 268h22M424 288h22M424 308h22" stroke="#d4c7b0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- front cover -->
    <rect x="56" y="20" width="364" height="328" rx="10" fill="url(#cover)"/>
    <rect x="56" y="20" width="364" height="328" rx="10" fill="none" stroke="#1f3f28" stroke-width="3" opacity="0.35"/>

    <!-- decorative frame -->
    <rect x="88" y="52" width="300" height="264" rx="6" fill="none" stroke="#e8a06a" stroke-width="2.5" opacity="0.85"/>
    <rect x="100" y="64" width="276" height="240" rx="4" fill="none" stroke="#f3efe6" stroke-width="1.25" opacity="0.35"/>

    <!-- center emblem -->
    <circle cx="238" cy="184" r="42" fill="none" stroke="#e8a06a" stroke-width="2"/>
    <circle cx="238" cy="184" r="28" fill="#c45c26" opacity="0.9"/>
    <path d="M238 168c-8 10-14 18-14 26a14 14 0 0 0 28 0c0-8-6-16-14-26z" fill="#f3efe6"/>

    <!-- spine -->
    <path d="M0 36c0-10 8-16 18-16h38v336H18c-10 0-18-6-18-16V36z" fill="url(#spine)"/>
    <path d="M18 28v320" stroke="#e8a06a" stroke-width="2" opacity="0.55"/>
    <path d="M34 70v240" stroke="#f3efe6" stroke-width="1.5" opacity="0.2"/>

    <!-- bottom board thickness -->
    <path d="M56 348h364c6 0 10 4 8 9l-10 22c-2 4-6 7-11 7H77c-5 0-9-3-11-7L56 357c-2-5 2-9 8-9z" fill="#243f2c"/>
  </g>
</svg>
